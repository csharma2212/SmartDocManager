services:
  - type: web
    name: smartdoc-classifier
    runtime: docker
    dockerfilePath: ./hosted-backend/Dockerfile
    dockerContext: ./hosted-backend
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SMARTDOC_CLIENT_TOKEN
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
